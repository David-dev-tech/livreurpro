<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>LivreurPro - Carte Cameroun</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1C1F24;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .card {
            background: #252930;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 1px solid rgba(0,212,232,0.2);
        }

        /* Barre de recherche */
        .search-bar {
            padding: 15px 20px;
            background: #1C1F24;
            border-bottom: 1px solid rgba(0,212,232,0.2);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-input-group {
            flex: 1;
            min-width: 250px;
            display: flex;
            gap: 10px;
        }

        .search-input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #2F343C;
            background: #2F343C;
            border-radius: 12px;
            color: #F2F4F7;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        .search-input-group input:focus {
            border-color: #00D4E8;
            box-shadow: 0 0 0 2px rgba(0,212,232,0.2);
        }

        .search-input-group input::placeholder {
            color: #6B7280;
        }

        .search-btn {
            padding: 12px 24px;
            background: #00D4E8;
            border: none;
            border-radius: 12px;
            color: #1C1F24;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .search-btn:hover {
            background: #00b8cc;
            transform: translateY(-1px);
        }

        .clear-btn {
            padding: 12px 20px;
            background: transparent;
            border: 1px solid #2F343C;
            border-radius: 12px;
            color: #9CA3AF;
            cursor: pointer;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            border-color: #00D4E8;
            color: #00D4E8;
        }

        /* Conteneur de la carte */
        .map-container {
            position: relative;
            height: 500px;
        }

        #map {
            height: 100%;
            width: 100%;
            background: #2F343C;
        }

        /* Panneau d'information des coordonnées */
        .coords-panel {
            padding: 15px 20px;
            background: #1C1F24;
            border-top: 1px solid rgba(0,212,232,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .coords-box {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .coord-item {
            background: #2F343C;
            padding: 8px 16px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 0.85rem;
        }

        .coord-label {
            color: #00D4E8;
            font-weight: 600;
            margin-right: 8px;
        }

        .coord-value {
            color: #F2F4F7;
        }

        .location-name {
            color: #9CA3AF;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .location-name i {
            color: #00D4E8;
        }

        .status {
            color: #00D4E8;
            font-size: 0.8rem;
        }

        @media (max-width: 768px) {
            .search-bar {
                flex-direction: column;
            }
            .search-input-group {
                width: 100%;
            }
            .coords-panel {
                flex-direction: column;
                text-align: center;
            }
            .map-container {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- Barre de recherche -->
            <div class="search-bar">
                <div class="search-input-group">
                    <input type="text" id="searchInput" placeholder="Rechercher un lieu au Cameroun (ex: Yaoundé, Douala, Mont Febe, etc.)">
                    <button class="search-btn" id="searchBtn">
                        <i class="fas fa-search"></i> Rechercher
                    </button>
                </div>
                <button class="clear-btn" id="clearBtn">
                    <i class="fas fa-trash-alt"></i> Effacer le marqueur
                </button>
            </div>

            <!-- Carte -->
            <div class="map-container">
                <div id="map"></div>
            </div>

            <!-- Panneau des coordonnées -->
            <div class="coords-panel">
                <div class="coords-box">
                    <div class="coord-item">
                        <span class="coord-label">Latitude :</span>
                        <span class="coord-value" id="latValue">---</span>
                    </div>
                    <div class="coord-item">
                        <span class="coord-label">Longitude :</span>
                        <span class="coord-value" id="lngValue">---</span>
                    </div>
                </div>
                <div class="location-name">
                    <i class="fas fa-map-marker-alt"></i>
                    <span id="locationName">Aucun lieu sélectionné</span>
                </div>
                <div class="status" id="status">
                    <i class="fas fa-info-circle"></i> Cliquez sur la carte ou recherchez un lieu
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // 1. INITIALISATION DE LA CARTE - CAMEROUN
        // ============================================
        
        // Coordonnées du centre du Cameroun
        const cameroonCenter = [5.6, 12.6]; // Environ centre géographique
        
        // Limites géographiques du Cameroun pour restreindre la carte
        const cameroonBounds = [
            [1.5, 8.5],   // Sud-Ouest (limite basse)
            [13.5, 16.5]  // Nord-Est (limite haute)
        ];
        
        // Initialisation de la carte
        const map = L.map('map').setView(cameroonCenter, 6.5);
        
        // Restreindre la carte aux limites du Cameroun
        map.setMaxBounds(cameroonBounds);
        map.on('drag', function() {
            map.panInsideBounds(cameroonBounds, { animate: true });
        });
        
        // Tuile OpenStreetMap (affiche les noms des rues et lieux)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 18,
            minZoom: 5
        }).addTo(map);
        
        // ============================================
        // 2. GESTION DU MARQUEUR
        // ============================================
        
        let currentMarker = null;
        
        // Icône personnalisée
        const customIcon = L.divIcon({
            html: '<div style="background: #00D4E8; width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 10px #00D4E8;"></div>',
            iconSize: [18, 18],
            className: 'custom-marker'
        });
        
        // Fonction pour ajouter/mettre à jour le marqueur
        function addMarker(lat, lng, locationName = null) {
            // Supprimer l'ancien marqueur s'il existe
            if (currentMarker) {
                map.removeLayer(currentMarker);
            }
            
            // Créer le nouveau marqueur
            currentMarker = L.marker([lat, lng], { icon: customIcon }).addTo(map);
            
            // Centrer la carte sur le marqueur
            map.setView([lat, lng], 14);
            
            // Afficher les coordonnées
            document.getElementById('latValue').textContent = lat.toFixed(6);
            document.getElementById('lngValue').textContent = lng.toFixed(6);
            
            // Mettre à jour le nom du lieu
            if (locationName) {
                document.getElementById('locationName').textContent = locationName;
            } else {
                document.getElementById('locationName').textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
            }
            
            // Ajouter une popup au marqueur
            currentMarker.bindPopup(`
                <strong>📍 Lieu sélectionné</strong><br>
                Latitude: ${lat.toFixed(6)}<br>
                Longitude: ${lng.toFixed(6)}
            `).openPopup();
            
            // Mettre à jour le statut
            document.getElementById('status').innerHTML = '<i class="fas fa-check-circle"></i> Marqueur placé avec succès';
            setTimeout(() => {
                document.getElementById('status').innerHTML = '<i class="fas fa-info-circle"></i> Cliquez sur la carte ou recherchez un lieu';
            }, 3000);
        }
        
        // ============================================
        // 3. CLIC SUR LA CARTE
        // ============================================
        
        map.on('click', async function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;
            
            // Vérifier si le clic est dans les limites du Cameroun
            if (lat < 1.5 || lat > 13.5 || lng < 8.5 || lng > 16.5) {
                document.getElementById('status').innerHTML = '<i class="fas fa-exclamation-triangle"></i> Veuillez sélectionner un lieu au Cameroun';
                return;
            }
            
            // Récupérer le nom du lieu via Nominatim
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`);
                const data = await response.json();
                
                let locationName = null;
                if (data.display_name) {
                    // Extraire le nom court (ville/quartier)
                    const parts = data.display_name.split(',');
                    locationName = parts.slice(0, 3).join(',');
                }
                
                addMarker(lat, lng, locationName);
                
            } catch (error) {
                console.log("Erreur de récupération du nom");
                addMarker(lat, lng, null);
            }
        });
        
        // ============================================
        // 4. RECHERCHE DE LIEU (LIMITÉE AU CAMEROUN)
        // ============================================
        
        async function searchLocation() {
            const query = document.getElementById('searchInput').value.trim();
            
            if (query === "") {
                document.getElementById('status').innerHTML = '<i class="fas fa-exclamation-triangle"></i> Veuillez entrer un lieu à rechercher';
                return;
            }
            
            // Afficher le chargement
            document.getElementById('status').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Recherche en cours...';
            
            try {
                // Requête Nominatim avec restriction au Cameroun (countrycodes=cm)
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=cm&limit=5&addressdetails=1`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.length === 0) {
                    document.getElementById('status').innerHTML = '<i class="fas fa-exclamation-triangle"></i> Aucun lieu trouvé au Cameroun. Essayez un autre nom.';
                    return;
                }
                
                // Prendre le premier résultat
                const result = data[0];
                const lat = parseFloat(result.lat);
                const lng = parseFloat(result.lon);
                const locationName = result.display_name.split(',')[0];
                
                // Vérifier les limites
                if (lat < 1.5 || lat > 13.5 || lng < 8.5 || lng > 16.5) {
                    document.getElementById('status').innerHTML = '<i class="fas fa-exclamation-triangle"></i> Le lieu trouvé est hors des limites du Cameroun';
                    return;
                }
                
                addMarker(lat, lng, locationName);
                
                // Optionnel : afficher les autres suggestions
                if (data.length > 1) {
                    console.log("Autres suggestions trouvées:", data.length - 1);
                }
                
            } catch (error) {
                console.error("Erreur de recherche:", error);
                document.getElementById('status').innerHTML = '<i class="fas fa-exclamation-triangle"></i> Erreur lors de la recherche. Réessayez.';
            }
        }
        
        // Recherche au clic du bouton ou avec la touche Entrée
        document.getElementById('searchBtn').addEventListener('click', searchLocation);
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchLocation();
            }
        });
        
        // ============================================
        // 5. EFFACER LE MARQUEUR
        // ============================================
        
        function clearMarker() {
            if (currentMarker) {
                map.removeLayer(currentMarker);
                currentMarker = null;
            }
            
            document.getElementById('latValue').textContent = '---';
            document.getElementById('lngValue').textContent = '---';
            document.getElementById('locationName').textContent = 'Aucun lieu sélectionné';
            document.getElementById('status').innerHTML = '<i class="fas fa-info-circle"></i> Marqueur effacé. Cliquez sur la carte ou recherchez un lieu.';
        }
        
        document.getElementById('clearBtn').addEventListener('click', clearMarker);
        
        // ============================================
        // 6. MESSAGE DE BIENVENUE
        // ============================================
        
        console.log("Carte chargée - Recherche limitée au Cameroun 🇨🇲");
        document.getElementById('status').innerHTML = '<i class="fas fa-info-circle"></i> Bienvenue ! Cliquez sur la carte ou recherchez un lieu au Cameroun';
    </script>
</body>
</html>
