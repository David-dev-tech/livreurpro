<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="stylesheet" href="css/css_index.css">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LivreurPro</title>

  <style>
    .split {
      display: flex;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    .left {
      flex: 0.8;                    /* 50% */
      padding: 60px 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #0f0f1a;        /* couleur de fond sombre qui correspond à ton thème noir/bleu */
      position: relative;
      z-index: 2;
    }

    .right {
      flex: 1.2;                    /* 50% */
      position: relative;
      overflow: hidden;
    }

    .right img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Dégradé fondu sur le côté gauche de l'image */
    .right::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      width: 80%;                 /* largeur du fondu - tu peux ajuster entre 30% et 50% */
      height: 100%;
      background: linear-gradient(to right, 
                                  rgba(15, 15, 26, 1) 0%, 
                                  rgba(15, 15, 26, 0.95) 20%,
                                  rgba(15, 15, 26, 0) 60%);
      z-index: 1;
      pointer-events: none;
    }
    /* ===================== RESPONSIVE ===================== */

    /* Tablette (entre 768px et 1024px) */
    @media (max-width: 768px) {
  .split {
    flex-direction: column;
    height: 100vh;
    position: relative;
    background-image: url('img/img1.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  /* Fondu en bas par-dessus l'image de fond */
  .split::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(15, 15, 26, 0)    0%,
      rgba(15, 15, 26, 0.3)  30%,
      rgba(15, 15, 26, 0.85) 65%,
      rgba(15, 15, 26, 1)   100%
    );
    z-index: 0;
    pointer-events: none;
  }

  /* Texte par-dessus le fondu */
  .left {
    position: relative;
    z-index: 1;
    flex: none;
    width: 100%;
    height: 100%;
    padding: 40px 25px;
    background: transparent;
    justify-content: flex-end;
  }

  /* On cache la balise <img> — l'image est maintenant en background */
  .right {
    display: none;
  }

  h1 {
    display: block;
    font-size: clamp(1.6rem, 8vw, 2.4rem);
    word-break: break-word;
    overflow-wrap: break-word;
    hyphens: auto;
  }
  h1 span {
    margin: 8vw;
  }

  .actions {
    flex-direction: column;
    gap: 12px;
  }

  .btn-main,
  .btn-outline {
    width: 100%;
    text-align: center;
  }
  .main-content {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .left {
    padding: 30px 20px;
  }

  h1 {
    font-size: clamp(1.4rem, 7vw, 2rem);
  }
}
  </style>
</head>
<body>

  <div class="split">

    <!-- LEFT 50% -->
    <div class="left">
      <nav class="nav">
        <div class="logo">
          <div style="display:inline-flex;align-items:center;justify-content:center;width:75px;height:48px;background:#00D4E8;border:2px solid #00D4E8;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));font-family:'Barlow Condensed',sans-serif;font-weight:900;font-style:italic;font-size:1.3rem;color:#1C1F24;letter-spacing:-.02em;">L.Pro</div>
          Livreur<span class="logo-dot">.</span>Pro
        </div>
      </nav>

      <div class="main-content">
        <div class="eyebrow">
          <span class="eyebrow-line"></span>
          <span class="eyebrow-text">La fiabilité à chaque km</span>
        </div>

        <h1>
          <span class="block">Rapidité</span>
          <span class="block outline">Fiabilité</span>
          <span class="block">Securité</span>
          <span class="block outline">Facilité</span>
        </h1>

        <p class="desc">
          LivreurPro inspire confiance, rapidité et fiabilité. Des livreurs qui reflètent le sérieux du service, modernes et accueillantes.
        </p>

        <div class="actions">

          <a href="views/us_form.php" class="btn-main">Démarrer</a>
          <a href="views/us_help.html" class="btn-outline">En savoir plus</a>
        </div>
      </div>
    </div>

    <!-- RIGHT 50% avec fondu à gauche -->
    <div class="right">
      <img src="img/img3.jpg" alt="Livreur sur moto - LivreurPro"/>
    </div>

  </div>

</body>
</html>
